name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Render a demo black hole (both modes)
        run: |
          node bin/commit-horizon.js --demo --out dist/disk.svg
          node bin/commit-horizon.js --demo --theme bw --out dist/bw.svg
          node bin/commit-horizon.js --demo --mode languages --out dist/languages.svg
